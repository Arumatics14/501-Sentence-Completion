<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>501 Sentence Completion — Arumatics™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c13;--card:#121624;--tx:#e9ecf6;--mu:#8b94ad;--bd:rgba(255,255,255,.1);--pr:#8b7cff;--prs:rgba(139,124,255,.14);--ok:#34d399;--oks:rgba(52,211,153,.12);--no:#fb7185;--nos:rgba(251,113,133,.12);--wa:#f5c451;--was:rgba(245,196,81,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali','Kalpurush','SolaimanLipi',system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:14px}
h1{font-size:1.35rem;margin:6px 0 2px}
.sub{color:var(--mu);font-size:.92rem;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:11px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.tab.on{border-color:var(--pr);background:var(--prs);color:var(--pr)}
.rules{font-size:.9rem;color:var(--mu);margin:0;padding-left:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.set{border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:var(--tx)}
.set:hover{border-color:var(--pr)}
.set b{display:block;font-size:1.02rem}
.time{display:inline-block;margin-top:6px;background:var(--was);color:var(--wa);font-weight:700;border-radius:8px;padding:2px 9px;font-size:.88rem}
.best{display:block;color:var(--mu);font-size:.8rem;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=number]{width:90px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:10px 16px;border-radius:10px;border:0;background:var(--pr);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--prs);color:var(--pr)}
.btn.red{background:var(--no)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.timer{background:var(--was);color:var(--wa);border:2px solid var(--wa);font-weight:700;font-size:1.25rem;border-radius:12px;padding:4px 14px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--nos);color:var(--no);border-color:var(--no);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.55}}
.prog{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--pr)}
.qn{color:var(--mu);font-size:.85rem}
.qt{font-size:1.12rem;font-weight:600;margin:6px 0 12px}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--pr)}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;margin-bottom:8px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pr)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt.sel{border-color:var(--pr);background:var(--prs)}
.opt.ok{border-color:var(--ok);background:var(--oks)}
.opt.no{border-color:var(--no);background:var(--nos)}
.opt:disabled{cursor:default}
.exp{border-left:4px solid var(--ok);background:var(--oks);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:.95rem}
.exp.bad{border-color:var(--no);background:var(--nos)}
.exp p{margin:4px 0}
.exp .en{color:var(--mu);font-size:.88rem}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin-top:8px}
.pb{padding:6px 0;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:.82rem;cursor:pointer}
.pb.ans{background:var(--prs);border-color:var(--pr);color:var(--pr);font-weight:700}
.pb.cur{outline:2px solid var(--wa)}
.pb.ok{background:var(--oks);border-color:var(--ok)}
.pb.no{background:var(--nos);border-color:var(--no)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.st{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.st b{display:block;font-size:1.3rem}
.big{font-size:2rem;font-weight:700;color:var(--pr);text-align:center}
.hide{display:none!important}
.tag{font-size:.78rem;padding:1px 8px;border-radius:8px;margin-left:6px}
.tag.ok{background:var(--oks);color:var(--ok)}.tag.no{background:var(--nos);color:var(--no)}.tag.sk{background:var(--was);color:var(--wa)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:8px 16px;border-radius:20px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--pr);background:var(--prs);color:var(--pr)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}
.mod .box{background:var(--card);border-radius:14px;padding:18px;max-width:380px;width:100%}
.mod .box p{margin:0 0 14px}
footer{color:var(--mu);font-size:.8rem;text-align:center;margin:18px 0}
/* ===== Premium dark theme ===== */
html{color-scheme:dark}
body{background:radial-gradient(1200px 600px at 10% -10%,rgba(139,124,255,.14),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(245,196,81,.08),transparent 55%),#0a0c13;background-attachment:fixed;min-height:100vh}
h1{font-size:1.6rem;font-weight:700;letter-spacing:.2px;background:linear-gradient(90deg,#fff,#b9b0ff 60%,#f5c451);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.sub{color:#a3acc4}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),#121624;border:1px solid rgba(255,255,255,.07);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tab{background:#121624;border:1px solid rgba(255,255,255,.08);border-radius:14px;transition:.2s}
.tab.on{background:linear-gradient(135deg,rgba(139,124,255,.25),rgba(139,124,255,.08));border-color:#8b7cff;color:#d6d1ff;box-shadow:0 0 0 3px rgba(139,124,255,.12),0 6px 20px rgba(139,124,255,.18)}
.set{background:#0f1320;border:1px solid rgba(255,255,255,.08);border-radius:14px;transition:.2s}
.set:hover{border-color:#8b7cff;transform:translateY(-2px);box-shadow:0 10px 24px rgba(139,124,255,.18)}
.time{background:rgba(245,196,81,.12);color:#f5c451;border:1px solid rgba(245,196,81,.35)}
.chip{background:#0f1320;border:1px solid rgba(255,255,255,.1);transition:.2s}
.chip.on{background:linear-gradient(135deg,#8b7cff,#6d5dfc);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(109,93,252,.35)}
.btn{background:linear-gradient(135deg,#8b7cff,#6d5dfc);box-shadow:0 6px 18px rgba(109,93,252,.3);border-radius:12px;transition:.2s}
.btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.btn.sec{background:rgba(139,124,255,.12);color:#c8c1ff;box-shadow:none;border:1px solid rgba(139,124,255,.25)}
.btn.red{background:linear-gradient(135deg,#fb7185,#e11d48);box-shadow:0 6px 18px rgba(225,29,72,.3)}
input[type=number]{background:#0a0d16;border:1px solid rgba(255,255,255,.12);color:#fff}
.top{background:rgba(10,12,19,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06);margin:0 -14px;padding:10px 14px}
.timer{background:linear-gradient(135deg,rgba(245,196,81,.18),rgba(245,196,81,.06));color:#f5c451;border:1.5px solid rgba(245,196,81,.55);box-shadow:0 0 18px rgba(245,196,81,.2)}
.timer.low{background:rgba(251,113,133,.15);color:#fb7185;border-color:#fb7185;box-shadow:0 0 18px rgba(251,113,133,.35)}
.prog{background:rgba(255,255,255,.08)}
.prog i{background:linear-gradient(90deg,#8b7cff,#f5c451);box-shadow:0 0 10px rgba(139,124,255,.6)}
.qt{font-size:1.15rem;color:#fff}
.blank{border-bottom:2px solid #f5c451}
.opt{background:#0f1320;border:1.5px solid rgba(255,255,255,.09);border-radius:14px;transition:.15s}
.opt:hover:not(:disabled){border-color:#8b7cff;background:#141a2c}
.opt .l{background:rgba(255,255,255,.07);color:#c8c1ff}
.opt.sel{border-color:#8b7cff;background:rgba(139,124,255,.16);box-shadow:0 0 0 3px rgba(139,124,255,.12)}
.opt.sel .l{background:#8b7cff;color:#fff}
.opt.ok{border-color:#34d399;background:rgba(52,211,153,.12)}
.opt.ok .l{background:#34d399;color:#04271b}
.opt.no{border-color:#fb7185;background:rgba(251,113,133,.12)}
.opt.no .l{background:#fb7185;color:#2b0710}
.exp{background:rgba(52,211,153,.09);border-left:4px solid #34d399;border-radius:10px}
.exp.bad{background:rgba(251,113,133,.09);border-left-color:#fb7185}
.st{background:#0f1320;border:1px solid rgba(255,255,255,.07);border-radius:12px}
.big{background:linear-gradient(90deg,#b9b0ff,#f5c451);-webkit-background-clip:text;background-clip:text;color:transparent}
.mod{background:rgba(3,5,10,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mod .box{background:#141826;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.6)}
footer{color:#6f7892}
.hd{display:flex;align-items:flex-end;justify-content:flex-start;flex-wrap:nowrap;gap:3px;margin:6px 0 4px}.hd h1{margin:0;flex:none;line-height:1.25;white-space:nowrap;font-size:clamp(1.05rem,5.4vw,1.6rem)}.cr{padding-bottom:.3em;font-size:clamp(.62rem,2.8vw,.85rem);font-weight:600;color:#f5c451;white-space:nowrap}


h1.t{display:block;margin:6px 0 4px;line-height:1.25;white-space:nowrap;font-size:clamp(1.05rem,5.4vw,1.6rem);background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#fff}
h1.t .g{background:linear-gradient(90deg,#fff,#b9b0ff 60%,#f5c451);-webkit-background-clip:text;background-clip:text;color:transparent}
h1.t .cr{display:inline;margin-left:4px;padding:0;font-size:clamp(.62rem,2.8vw,.85rem);font-weight:600;color:#f5c451;-webkit-text-fill-color:#f5c451}
.bnm{color:#f5c451;font-weight:600;font-size:.92em}


#review .w{cursor:pointer;-webkit-tap-highlight-color:transparent}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#161b2c;border-top:1px solid rgba(245,196,81,.4);border-radius:18px 18px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.6);padding:14px 16px 18px;max-width:860px;margin:0 auto;transform:translateY(110%);transition:transform .22s}
.sheet.open{transform:none}
.sheet .sw{font-size:1.25rem;font-weight:700;color:#fff}
.sheet .sb{font-size:1.15rem;color:#f5c451;font-weight:600;margin:4px 0}
.sheet .sa{color:var(--mu);font-size:.9rem}
.sheet .sx{float:right}
</style>
</head>
<body>
<div class="wrap">

<div id="home">
  <h1 class="t"><span class="g">📘 501 Sentence<br>Completion</span><span class="cr">© Arumatics™</span></h1>
  <div class="sub">ব্যাংক জব ও আইবিএ ভর্তি প্রস্তুতি</div>
  <div class="tabs">
    <button class="tab on" id="tPrac" onclick="setMode('practice')">📝 প্র্যাকটিস</button>
    <button class="tab" id="tQuiz" onclick="setMode('quiz')">⏱️ কুইজ (পরীক্ষা)</button>
  </div>
  <div class="card" id="ruleBox"></div>
  <div class="card">
    <b>কয়টি প্রশ্ন দিতে চান?</b>
    <div class="chips" id="cntChips"></div>
    <div style="margin-top:12px"><b>প্রশ্নের ক্রম</b></div>
    <div class="chips" id="ordChips"></div>
  </div>
  <div class="card"><b>সেট বেছে নিন</b><div class="grid" id="sets" style="margin-top:10px"></div></div>
  <div class="card">
    <b>নিজের রেঞ্জ</b>
    <div class="row" style="margin-top:8px">
      <input type="number" id="from" min="1" max="501" value="1"> থেকে
      <input type="number" id="to" min="1" max="501" value="50">
      <button class="btn sec" onclick="startRange()">শুরু করুন</button>
      <button class="btn sec" onclick="startRandom()">🎲 সব ৫০১ থেকে র‍্যান্ডম</button>
    </div>
    <div class="qn" id="rangeTime" style="margin-top:6px"></div>
  </div>
  <footer>উৎস: 501 Sentence Completion Questions<br>© Arumatics™</footer>
</div>

<div id="exam" class="hide">
  <div class="top">
    <div class="bar">
      <div><b id="eTitle"></b> <span class="qn" id="eMode"></span></div>
      <div class="row"><div class="timer" id="timer">00:00</div><button class="btn sec" onclick="quitExam()">✖ বাদ দিন</button></div>
    </div>
    <div class="prog"><i id="prog" style="width:0"></i></div>
  </div>
  <div class="card">
    <div class="qn" id="qn"></div>
    <div class="qt" id="qt"></div>
    <div id="opts"></div>
    <div id="exp"></div>
    <div class="nav">
      <button class="btn sec" id="prev" onclick="go(-1)">← আগের</button>
      <button class="btn red" id="finish" onclick="finishExam()">পরীক্ষা শেষ করুন</button>
      <button class="btn" id="next" onclick="go(1)">পরের →</button>
    </div>
  </div>
</div>

<div id="result" class="hide">
  <div class="card">
    <div class="big" id="rScore"></div>
    <div class="qn" style="text-align:center" id="rSub"></div>
    <div class="stats" id="rStats"></div>
    <div class="row">
      <button class="btn" onclick="home()">🏠 হোমে ফিরুন</button>
      <button class="btn sec" onclick="retry()">🔁 আবার দিন</button>
      <button class="btn sec" id="fWrong" onclick="filt('wrong')">❌ ভুল/স্কিপ</button>
      <button class="btn sec" onclick="filt('all')">সব দেখুন</button>
    </div>
  </div>
  <div id="review"></div>
</div>

</div>

<div id="sheet" class="sheet"><button class="btn sec sx" onclick="closeSheet()">✕</button><div class="sw" id="sW"></div><div class="sb" id="sB"></div><div class="sa" id="sA"></div></div>
<div id="modal" class="mod hide"><div class="box"><p id="mMsg"></p><div class="row" style="justify-content:flex-end"><button class="btn sec" id="mNo">না</button><button class="btn red" id="mYes">হ্যাঁ</button></div></div></div>

const dur=n=>n*SEC_PER_Q;
const durTxt=n=>{const s=dur(n),m=Math.floor(s/60),x=s%60;return bd(m)+' মিনিট'+(x?' '+bd(x)+' সেকেন্ড':'')};
const fix=t=>t.replace(/_{2,}/g,'<span class="blank"></span>');

function setMode(m){mode=m;$('tPrac').classList.toggle('on',m==='practice');$('tQuiz').classList.toggle('on',m==='quiz');renderHome()}
function ask(msg,yes,cb){$('mMsg').textContent=msg;$('mYes').textContent=yes;$('modal').classList.remove('hide');
  $('mNo').onclick=()=>$('modal').classList.add('hide');$('mYes').onclick=()=>{$('modal').classList.add('hide');cb()}}
function setCnt(n){cnt=n;renderHome()}
function setOrd(o){ord=o;renderHome()}
function pickList(s,e){let a=DATA.slice(s-1,e);if(ord==='rand')a=[...a].sort(()=>Math.random()-.5);return a.slice(0,Math.min(cnt,a.length))}
function renderHome(){
  $('cntChips').innerHTML=[10,20,30,50,100].map(n=>`<button class="chip ${cnt===n?'on':''}" onclick="setCnt(${n})">${bd(n)}টি</button>`).join('');
  $('ordChips').innerHTML=[['rand','🔀 র‍্যান্ডম'],['seq','🔢 ক্রমানুসারে']].map(([k,l])=>`<button class="chip ${ord===k?'on':''}" onclick="setOrd('${k}')">${l}</button>`).join('');
  $('ruleBox').innerHTML=mode==='quiz'
   ?'<b>⏱️ কুইজের নিয়ম</b><ul class="rules"><li>প্রতিটি প্রশ্নে সময় ৩৬ সেকেন্ড হিসাবে মোট সময় (১০০টি = ৬০ মিনিট)</li><li>ভুল উত্তরে <b>−০.২৫</b> নম্বর, সঠিকে +১, উত্তর না দিলে ০</li><li>একবার উত্তর দিলে আর <b>পরিবর্তন করা যাবে না</b></li><li>পরীক্ষার সময় সঠিক উত্তর দেখা যাবে না</li><li>যেকোনো সময় "পরীক্ষা শেষ করুন" চাপা যাবে; সময় শেষ হলে অটো জমা হবে</li><li>শেষে বাংলা ব্যাখ্যাসহ রিভিউ পাবেন</li></ul>'
   :'<b>📝 প্র্যাকটিস মোড</b><ul class="rules"><li>উত্তর বাছাই করলেই সঙ্গে সঙ্গে সঠিক/ভুল ও বাংলা ব্যাখ্যা দেখাবে</li><li>সময়ের চাপ নেই, নেগেটিভ মার্ক নেই</li></ul>';
  const sets=[];for(let s=1;s<=501;s+=100){const e=Math.min(s+99,501);if(s===401)sets.push([401,501]);else sets.push([s,e]);}
  $('sets').innerHTML=sets.map(([s,e])=>{const tot=e-s+1,n=Math.min(cnt,tot),b=store.get('best_'+s+'_'+e+'_'+n);
   return `<button class="set" onclick="startSet(${s},${e})"><b>প্রশ্ন ${bd(s)} – ${bd(e)}</b><span>${bd(n)}টি MCQ (মোট ${bd(tot)}টির মধ্যে)</span><br>${mode==='quiz'?`<span class="time">⏱ ${durTxt(n)}</span>`:''}${b!=null?`<span class="best">সেরা স্কোর: ${bd(b)}</span>`:''}</button>`}).join('');
  updRange();
}
function updRange(){const f=+$('from').value,t=+$('to').value;if(f>=1&&t>=f&&t<=501)$('rangeTime').innerHTML=mode==='quiz'?`<span class="time">⏱ ${durTxt(Math.min(cnt,t-f+1))}</span>`:'';else $('rangeTime').textContent=''}
$('from').oninput=$('to').oninput=updRange;
function startSet(s,e){const l=pickList(s,e);begin(l,`প্রশ্ন ${bd(s)}–${bd(e)}`,'best_'+s+'_'+e+'_'+l.length)}
function startRange(){const f=+$('from').value,t=+$('to').value;if(!(f>=1&&t>=f&&t<=501)){ask('সঠিক রেঞ্জ দিন (১–৫০১)','ঠিক আছে',()=>{});return}startSet(f,t)}
function startRandom(){const a=[...DATA].sort(()=>Math.random()-.5).slice(0,cnt);begin(a,'র‍্যান্ডম '+bd(cnt),null)}

function begin(list,label,key){
  cur={list,ans:Array(list.length).fill(null),i:0,ended:false,label,key,mode,start:Date.now(),left:dur(list.length)};
  $('home').classList.add('hide');$('result').classList.add('hide');$('exam').classList.remove('hide');
  $('eTitle').textContent=label;$('eMode').textContent=mode==='quiz'?'• কুইজ':'• প্র্যাকটিস';
  $('timer').classList.toggle('hide',mode!=='quiz');
  $('finish').textContent=mode==='quiz'?'পরীক্ষা শেষ করুন':'প্র্যাকটিস শেষ';
  if(mode==='quiz'){tick();cur.tid=setInterval(tick,1000)}
  render();window.scrollTo(0,0);
}
function tick(){
  const el=Math.floor((Date.now()-cur.start)/1000);cur.left=dur(cur.list.length)-el;
  const t=$('timer');t.textContent='⏱ '+fmt(cur.left);t.classList.toggle('low',cur.left<=300);
  if(cur.left<=0){clearInterval(cur.tid);submit(true)}
}
function render(){
  const q=cur.list[cur.i],a=cur.ans[cur.i],prac=cur.mode==='practice';
  $('qn').textContent=`প্রশ্ন ${bd(cur.i+1)} / ${bd(cur.list.length)}  (মূল নং ${bd(q.n)})`;
  let qt=fix(q.q);if(!/blank/.test(qt))qt+=' <span class="blank"></span>';
  $('qt').innerHTML=qt;
  $('opts').innerHTML=q.o.map((o,k)=>{
    let c='opt',dis=a!==null?'disabled':'';
    if(a!==null){if(prac){if(k===q.a)c+=' ok';else if(k===a)c+=' no'}else if(k===a)c+=' sel'}
    return `<button class="${c}" ${dis} onclick="pick(${k})"><span class="l">${LET[k].toUpperCase()}</span><span>${o}${(prac&&a!==null&&k===q.a)?` <span class="bnm">(${q.b})</span>`:''}</span></button>`}).join('');
  $('exp').innerHTML=(prac&&a!==null)?expHTML(q,a):'';
  $('prev').disabled=cur.i===0;$('next').disabled=cur.i===cur.list.length-1;
  $('prog').style.width=(cur.ans.filter(x=>x!==null).length/cur.list.length*100)+'%';
}
function expHTML(q,a,reveal){
  const right=a===q.a;const W=reveal?wrapEN:(x=>x);
  return `<div class="exp ${right?'':'bad'}"><p><b>${right?'✅ সঠিক!':(a===null?'⏭️ উত্তর দেননি':'❌ ভুল')}</b> — সঠিক উত্তর: <b>${LET[q.a].toUpperCase()}. ${W(q.o[q.a])} <span class="bnm">(${q.b})</span></b></p><p><b>বাংলা অর্থ:</b> ${q.b}</p><p><b>ব্যাখ্যা:</b> ${q.f}</p><p class="en">${W(q.e)}</p></div>`;
}
function pick(k){
  if(cur.ended||cur.ans[cur.i]!==null)return; // একবার দিলে পরিবর্তন নয়
  cur.ans[cur.i]=k;render();
}
function go(d){cur.i=Math.min(cur.list.length-1,Math.max(0,cur.i+d));render();window.scrollTo(0,0)}
function finishExam(){
  const done=cur.ans.filter(x=>x!==null).length,tot=cur.list.length;
  const msg=cur.mode==='quiz'?`আপনি ${bd(tot)}টির মধ্যে ${bd(done)}টির উত্তর দিয়েছেন। পরীক্ষা শেষ করবেন? (আর ফেরা যাবে না)`:`প্র্যাকটিস শেষ করে ফলাফল দেখবেন?`;
  ask(msg,'হ্যাঁ, শেষ করুন',()=>{clearInterval(cur.tid);submit(false)})
}
function quitExam(){ask('পরীক্ষা বাদ দিয়ে হোমে ফিরবেন? কোনো ফলাফল সেভ হবে না।','হ্যাঁ, বাদ দিন',()=>{clearInterval(cur.tid);cur.ended=true;home()})}
function submit(auto){
  cur.ended=true;clearInterval(cur.tid);
  const used=Math.min(dur(cur.list.length),Math.floor((Date.now()-cur.start)/1000));
  let c=0,w=0,s=0;cur.list.forEach((q,i)=>{const a=cur.ans[i];if(a===null)s++;else if(a===q.a)c++;else w++});
  const quiz=cur.mode==='quiz',neg=quiz?w*NEG:0,score=c-neg;
  cur.res={c,w,s,neg,score,used};
  if(quiz&&cur.key){const b=store.get(cur.key);if(b==null||score>b)store.set(cur.key,score)}
  $('exam').classList.add('hide');$('result').classList.remove('hide');
  $('rScore').textContent=`${bd(+score.toFixed(2))} / ${bd(cur.list.length)}`;
  $('rSub').textContent=(auto?'⏰ সময় শেষ — অটো জমা হয়েছে • ':'')+(quiz?'নেগেটিভ মার্কিং: ভুল প্রতি −০.২৫':'প্র্যাকটিস (নেগেটিভ মার্ক নেই)');
  $('rStats').innerHTML=[['✅ সঠিক',c],['❌ ভুল',w],['⏭️ স্কিপ',s],['➖ কাটা নম্বর',quiz?'−'+bd(+neg.toFixed(2)):'০'],['⏱ সময় লেগেছে',fmt(used)],['🎯 নির্ভুলতা',bd(c+w?Math.round(c/(c+w)*100):0)+'%']].map(([a,b])=>`<div class="st"><b>${typeof b==='number'?bd(b):b}</b>${a}</div>`).join('');
  filt('all');window.scrollTo(0,0);
}
function filt(t){
  $('review').innerHTML=cur.list.map((q,i)=>{
    const a=cur.ans[i],ok=a===q.a;
    if(t==='wrong'&&ok)return'';
    const tag=a===null?'<span class="tag sk">স্কিপ</span>':ok?'<span class="tag ok">সঠিক</span>':'<span class="tag no">ভুল</span>';
    let qt=fix(wrapEN(q.q));if(!/blank/.test(qt))qt+=' <span class="blank"></span>';
    return `<div class="card"><div class="qn">প্রশ্ন ${bd(i+1)} (মূল নং ${bd(q.n)}) ${tag}</div><div class="qt">${qt}</div>`+
      q.o.map((o,k)=>`<div class="opt ${k===q.a?'ok':(k===a?'no':'')}" style="cursor:default"><span class="l">${LET[k].toUpperCase()}</span><span>${wrapEN(o)}</span>${k===a?'<small>(আপনার উত্তর)</small>':''}</div>`).join('')+
      expHTML(q,a,true)+`</div>`}).join('')||'<div class="card">সবগুলো সঠিক! 🎉</div>';
}
function home(){closeSheet();$('result').classList.add('hide');$('exam').classList.add('hide');$('home').classList.remove('hide');renderHome();window.scrollTo(0,0)}
function retry(){const l=cur.list,lb=cur.label,k=cur.key;begin(l,lb,k)}
window.addEventListener('beforeunload',e=>{if(cur&&!cur.ended&&!$('exam').classList.contains('hide')){e.preventDefault();e.returnValue=''}});


const wrapEN=t=>t.replace(/[A-Za-z][A-Za-z'-]*/g,m=>`<span class="w">${m}</span>`);
const localDict={};DATA.forEach(q=>{localDict[q.o[q.a].toLowerCase()]=q.b});
function closeSheet(){$('sheet').classList.remove('open')}
async function lookup(w){
  const k=w.toLowerCase().replace(/^[-']+|[-']+$/g,'');
  const c=store.get('dict_'+k);if(c)return c;
  const q=encodeURIComponent(k);
  const tmo=(u)=>{const ac=typeof AbortController!=='undefined'?new AbortController():null;const t=setTimeout(()=>ac&&ac.abort(),8000);return fetch(u,ac?{signal:ac.signal}:{}).finally(()=>clearTimeout(t))};
  const tries=[
    async()=>{const j=await (await tmo('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&dt=bd&q='+q)).json();
      const main=(j[0]||[]).map(x=>x[0]).join('');const alts=[];
      (j[1]||[]).forEach(p=>{(p[1]||[]).slice(0,3).forEach(t=>{if(t!==main&&alts.indexOf(t)<0&&alts.length<5)alts.push(t)})});
      if(!main)throw 0;return{m:main,a:alts}},
    async()=>{const j=await (await tmo('https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl=bn&q='+q)).json();
      let m=Array.isArray(j)?(Array.isArray(j[0])?j[0][0]:j[0]):(j.sentences&&j.sentences[0]&&j.sentences[0].trans);
      if(!m)throw 0;return{m:m,a:[]}},
    async()=>{const j=await (await tmo('https://lingva.ml/api/v1/en/bn/'+q)).json();
      if(!j.translation)throw 0;return{m:j.translation,a:[]}},
    async()=>{const j=await (await tmo('https://api.mymemory.translated.net/get?q='+q+'&langpair=en|bn')).json();
      const m=j&&j.responseData&&j.responseData.translatedText;
      if(!m||/MYMEMORY|INVALID|QUERY LENGTH/i.test(m))throw 0;return{m:m,a:[]}}
  ];
  const res=await new Promise(resolve=>{let left=tries.length,done=false;
    tries.forEach(f=>{f().then(r=>{if(!done){done=true;resolve(r)}}).catch(()=>{if(--left===0&&!done)resolve(null)})})});
  if(res)store.set('dict_'+k,res);
  return res;
}
async function showWord(w){
  const k=w.toLowerCase();
  $('sW').textContent=w;$('sB').textContent='…';$('sA').textContent='';
  $('sheet').classList.add('open');
  if(localDict[k]){$('sB').textContent=localDict[k];$('sA').textContent='(বইয়ের অর্থ)'}
  const r=await lookup(w);
  if($('sW').textContent!==w)return;
  if(r){
    if(localDict[k]){$('sA').textContent='অন্যান্য অর্থ: '+[r.m].concat(r.a).join(', ')}
    else{$('sB').textContent=r.m;$('sA').textContent=r.a.length?'অন্যান্য অর্থ: '+r.a.join(', '):''}
  }else if(!localDict[k]){$('sB').textContent='অর্থ আনা যায়নি';$('sA').innerHTML='ইন্টারনেট সংযোগ লাগবে (Claude অ্যাপের প্রিভিউতে বাইরের সংযোগ ব্লক থাকে — GitHub Pages বা সরাসরি ব্রাউজারে খুলুন)। <a style="color:#f5c451" target="_blank" rel="noopener" href="https://translate.google.com/?sl=en&tl=bn&op=translate&text='+encodeURIComponent(w)+'">Google Translate-এ দেখুন ↗</a>'}
}
document.addEventListener('click',e=>{
  const w=e.target.closest&&e.target.closest('#review .w');
  if(w){showWord(w.textContent);return}
  if(!e.target.closest('#sheet'))closeSheet();
});
renderHome();
</script>
</body>
</html>
